<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" fill="none" role="img" aria-label="Leopold — autonomous multi-agent systems and self-hosted infrastructure">
  <defs>
    <!-- dark base gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161D"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <!-- phosphor-green glow from top -->
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#00FF94" stop-opacity="0.20"/>
      <stop offset="0.4" stop-color="#00FF94" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00FF94" stop-opacity="0"/>
    </radialGradient>
    <!-- faint grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1B2230" stroke-width="1"/>
    </pattern>
    <!-- soft green text glow -->
    <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- surface -->
  <rect x="1" y="1" width="838" height="238" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="838" height="238" rx="16" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="420" cy="-10" rx="520" ry="190" fill="url(#glow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- hairline frame -->
  <rect x="1" y="1" width="838" height="238" rx="16" fill="none" stroke="#21262D" stroke-width="1.5"/>

  <!-- traffic-dot chrome, top-left -->
  <g transform="translate(28,28)">
    <circle cx="0" cy="0" r="5" fill="#30363D"/>
    <circle cx="18" cy="0" r="5" fill="#30363D"/>
    <circle cx="36" cy="0" r="5" fill="#30363D"/>
    <text x="58" y="4" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#6E7681" letter-spacing="0.5">leopold@production: ~</text>
  </g>

  <!-- wordmark -->
  <text x="420" y="116" text-anchor="middle"
        font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="62" font-weight="700" letter-spacing="6"
        fill="#E6EDF3" filter="url(#textglow)">LEOPOLD</text>

  <!-- tagline -->
  <text x="420" y="150" text-anchor="middle"
        font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="14.5" letter-spacing="1.5" fill="#8B949E">autonomous multi-agent systems  ·  self-hosted infrastructure</text>

  <!-- prompt chip -->
  <g transform="translate(255,182)">
    <rect x="0" y="0" width="330" height="34" rx="8" fill="#161B22" stroke="#21262D"/>
    <text x="16" y="22" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#00FF94">$ ./build.sh --mode=autonomous</text>
    <rect x="288" y="9" width="9" height="17" fill="#00FF94">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status, bottom-right -->
  <g transform="translate(812,214)" text-anchor="end">
    <circle cx="-92" cy="-4" r="4" fill="#00FF94">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-104" y="0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#8B949E">shipping</text>
  </g>
</svg>
