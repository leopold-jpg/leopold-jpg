  <text x="420" y="24" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12" fill="#6E7681">/etc/principles</text>
  <text x="24.0" y="52" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#6E7681" xml:space="preserve">/* operating principles — non-negotiable */</text>
  
  <text x="24.0" y="98" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#00FF94" xml:space="preserve">#define </text><text x="91.4" y="98" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#79C0FF" xml:space="preserve">BIAS_TO_AUTONOMY      </text><text x="276.6" y="98" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#7EE787" xml:space="preserve">"if a human types it twice, it's a bug"</text>
  <text x="24.0" y="121" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#00FF94" xml:space="preserve">#define </text><text x="91.4" y="121" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#79C0FF" xml:space="preserve">BRIEFS_OVER_TICKETS   </text><text x="276.6" y="121" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#7EE787" xml:space="preserve">"tasks ship with execution context"</text>
  <text x="24.0" y="144" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#00FF94" xml:space="preserve">#define </text><text x="91.4" y="144" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#79C0FF" xml:space="preserve">SELF_HOSTED_DEFAULT   </text><text x="276.6" y="144" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#7EE787" xml:space="preserve">"i own the metal, the keys, the logs"</text>
  <text x="24.0" y="167" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#00FF94" xml:space="preserve">#define </text><text x="91.4" y="167" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#79C0FF" xml:space="preserve">NEVER_TRUST_DEFAULTS  </text><text x="276.6" y="167" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#7EE787" xml:space="preserve">"audit, sandbox, rotate, repeat"</text>
  
  <text x="24.0" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#00FF94" xml:space="preserve">while </text><text x="74.5" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#8B949E" xml:space="preserve">(problem_unsolved) </text><text x="234.5" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#8B949E" xml:space="preserve">{ </text><text x="251.3" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#D2A8FF" xml:space="preserve">ship</text><text x="285.0" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#8B949E" xml:space="preserve">(); </text><text x="318.7" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#D2A8FF" xml:space="preserve">measure</text><text x="377.6" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#8B949E" xml:space="preserve">(); </text><text x="411.3" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#D2A8FF" xml:space="preserve">iterate</text><text x="470.3" y="213" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#8B949E" xml:space="preserve">(); }</text>
