<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96" fill="none" role="img" aria-label="connection to production closed">
  <defs>
    <linearGradient id="ftbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <radialGradient id="ftglow" cx="50%" cy="120%" r="70%">
      <stop offset="0" stop-color="#00FF94" stop-opacity="0.16"/><stop offset="1" stop-color="#00FF94" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="838" height="94" rx="14" fill="url(#ftbg)" stroke="#21262D" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="94" rx="14" fill="url(#ftglow)"/>
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" text-anchor="middle">
    <text x="420" y="40" font-size="14" fill="#00FF94">leopold@production:~$ logout</text>
