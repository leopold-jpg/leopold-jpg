    </filter>
  </defs>
  <rect x="1" y="8" width="168" height="30" rx="8" fill="#161B22" stroke="#21262D"/>
  <text x="16" y="28" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#00FF94" filter="url(#g)">▸</text>
  <text x="34" y="28" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="14" fill="#E6EDF3">cat ~/.stack</text>
  <line x1="184" y1="23" x2="824" y2="23" stroke="#21262D" stroke-width="1.5"/>
  <text x="818" y="27" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12" fill="#6E7681">// tooling</text>
