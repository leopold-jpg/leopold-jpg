<svg xmlns="http://www.w3.org/2000/svg" width="840" height="46" viewBox="0 0 840 46" fill="none" role="img" aria-label="cat ~/.stack">
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
