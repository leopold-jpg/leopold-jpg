<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" fill="none" role="img" aria-label="focus allocation — process monitor">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0F141B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B86B"/><stop offset="1" stop-color="#00FF94"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="838" height="194" rx="14" fill="url(#fbg)" stroke="#21262D" stroke-width="1.5"/>

  <!-- header -->
  <circle cx="24" cy="26" r="4.5" fill="#30363D"/><circle cx="40" cy="26" r="4.5" fill="#30363D"/><circle cx="56" cy="26" r="4.5" fill="#30363D"/>
  <text x="78" y="30" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12.5" fill="#8B949E">top — focus allocation · where the cycles go</text>
  <text x="816" y="30" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#6E7681">load: shipping</text>
  <line x1="20" y1="44" x2="820" y2="44" stroke="#21262D" stroke-width="1"/>

  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13">
    <!-- row 1 — width is STATIC (always visible); a shine sweeps across for life -->
    <text x="24" y="74" fill="#E6EDF3">multi-agent orchestration</text>
    <rect x="300" y="63" width="440" height="14" rx="7" fill="#0D1117" stroke="#21262D"/>
    <clipPath id="c1"><rect x="300" y="63" width="180" height="14" rx="7"/></clipPath>
    <rect x="300" y="63" width="180" height="14" rx="7" fill="url(#bar)"/>
    <rect x="300" y="63" width="80" height="14" fill="url(#shine)" clip-path="url(#c1)"><animate attributeName="x" values="180;480;180" dur="4.5s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="816" y="74" text-anchor="end" fill="#00FF94">40%</text>

    <!-- row 2 -->
    <text x="24" y="106" fill="#E6EDF3">self-hosted infra</text>
    <rect x="300" y="95" width="440" height="14" rx="7" fill="#0D1117" stroke="#21262D"/>
    <clipPath id="c2"><rect x="300" y="95" width="145" height="14" rx="7"/></clipPath>
    <rect x="300" y="95" width="145" height="14" rx="7" fill="url(#bar)"/>
    <rect x="300" y="95" width="80" height="14" fill="url(#shine)" clip-path="url(#c2)"><animate attributeName="x" values="180;445;180" dur="4.5s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="816" y="106" text-anchor="end" fill="#00FF94">32%</text>

    <!-- row 3 -->
    <text x="24" y="138" fill="#E6EDF3">product · 0→1</text>
    <rect x="300" y="127" width="440" height="14" rx="7" fill="#0D1117" stroke="#21262D"/>
    <clipPath id="c3"><rect x="300" y="127" width="126" height="14" rx="7"/></clipPath>
    <rect x="300" y="127" width="126" height="14" rx="7" fill="url(#bar)"/>
    <rect x="300" y="127" width="80" height="14" fill="url(#shine)" clip-path="url(#c3)"><animate attributeName="x" values="180;426;180" dur="4.5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="816" y="138" text-anchor="end" fill="#00FF94">28%</text>
  </g>

  <line x1="20" y1="158" x2="820" y2="158" stroke="#21262D" stroke-width="1"/>
  <text x="24" y="178" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#6E7681">$ ps aux | grep leopold &#160;&#160;→&#160;&#160; 3 processes, 0 idle</text>
  <circle cx="812" cy="174" r="3.5" fill="#00FF94"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
