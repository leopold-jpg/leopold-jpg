<svg xmlns="http://www.w3.org/2000/svg" width="420" height="168" viewBox="0 0 420 168" fill="none" role="img" aria-label="AI / AGENTS">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF94" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00FF94" stop-opacity="0"/>
    </linearGradient>
    <filter id="ig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="418" height="166" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="418" height="166" rx="14" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
  <rect x="1" y="1" width="418" height="3" fill="url(#acc)"/>
  <!-- scanline -->
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="420" height="34" fill="#00FF94" opacity="0.05">
      <animate attributeName="y" values="-34;168" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- icon -->
  <g transform="translate(22,22)" filter="url(#ig)"><g fill="none" stroke="#00FF94" stroke-width="2"><circle cx="6" cy="14" r="3"/><circle cx="22" cy="6" r="3"/><circle cx="22" cy="22" r="3"/><path d="M9 13 L19 7 M9 15 L19 21"/></g></g>
  <text x="60" y="40" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="1.5" fill="#E6EDF3">AI / AGENTS</text>
  <!-- pulsing online dot -->
  <circle cx="398" cy="30" r="3.5" fill="#00FF94"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="24" y="74" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#8B949E"><tspan fill="#00FF94">▸ </tspan>Multi-agent orchestration</text>
  <text x="24" y="96" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#8B949E"><tspan fill="#00FF94">▸ </tspan>MCP server development</text>
  <text x="24" y="118" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#8B949E"><tspan fill="#00FF94">▸ </tspan>Tool-calling architectures</text>
  <text x="24" y="140" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13" fill="#8B949E"><tspan fill="#00FF94">▸ </tspan>RAG · embeddings · voice</text>
</svg>
