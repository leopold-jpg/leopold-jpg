name: Generate Snake

on:
  schedule:
    # Kör varje natt kl 00:00 UTC
    - cron: "0 0 * * *"
  # Tillåter manuell körning från Actions-fliken
  workflow_dispatch:
  # Kör vid push till main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00FF94&color_dots=0D1117,0E4429,006D32,26A641,39D353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
